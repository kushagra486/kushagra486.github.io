name: Release

# Publishes a GitHub Release for the portfolio: tags the chosen commit, attaches the built
# static site as a zip, and uses .github/release-notes/<tag>.md as the notes when present.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag must look like v2, v2.0 or v2.0.1 (got '$TAG')" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-os/package-lock.json

      - name: Build static export
        working-directory: desktop-os
        run: |
          npm ci
          npm run build

      - name: Package site
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd desktop-os/out
          zip -qr "$GITHUB_WORKSPACE/kushagra-os-$TAG.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          args=(--target "$GITHUB_SHA" --title "${TITLE:-$TAG}" --latest)
          if [ -f "$NOTES" ]; then
            args+=(--notes-file "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG" "kushagra-os-$TAG.zip" "${args[@]}"
